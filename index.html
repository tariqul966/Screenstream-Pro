<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture In Picture</title>
    <link rel="icon" type="image/png" href="https://www.google.com/s2/u/0/favicons?domain=jacinto.design">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap');

        html {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(37, 37, 37);
        }

        .button-container {
            border: 2px solid black;
            padding: 10px;
            border-radius: 7px;
            box-shadow: inset 0 20px 4px -19px rgba(255,255,255,0.4);
        }

        button {
            cursor: pointer;
            outline: none;
            width: 120px;
            height: 75px;
            font-family: 'Lato', sans-serif;
            font-size: 25px;
            color: white;
            text-shadow: 0 2px 5px black;
            background: linear-gradient(to top, #696969, #575757);
            border: 2px solid black;
            border-radius: 7px;
            box-shadow: inset 0 20px 4px -19px rgba(255,255,255,0.4), 0 12px 12px 0px rgba(0,0,0,0.3);
        }

        button:hover {
            background: linear-gradient(to bottom, #696969, #575757);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 6px 6px 0px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- Video -->
    <video id="video" controls height="360" width="640">git branch</video>
    
    <!-- Button -->
    <div class="button-container">
        <button id="button">START</button>
    </div>

    <!-- Script -->
    <script>
        // Set constants for all targeted elements
        const videoElement = document.getElementById('video');
        const button = document.getElementById('button');

        // Prompt to select media stream, pass to video element, then play
        async function selectMediastream() {
            try {
                const mediaStream = await navigator.mediaDevices.getDisplayMedia();
                videoElement.srcObject = mediaStream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                }
            } catch (error) {
                console.log('whoops, error here:', error);
            }
        }

        button.addEventListener('click', async () => {
            // Disable the button 
            button.disabled = true;
            // Start Picture in Picture
            await videoElement.requestPictureInPicture();
            // Reset Button
            button.disabled = false;
        });

        // On Load
        selectMediastream();
    </script>
</body>
</html>
